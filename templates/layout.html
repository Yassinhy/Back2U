<!DOCTYPE HTML>
<html>

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">


    <title>{% block title %}{% endblock %}</title>

</head>
<body>
    <!--Make a navigation bar!!!-->
    <header>
        {%if session['user_id'] %}
        <a href = "/choice"><img src = "/static/images/logo_black.png" class = "logo"></a>
        <nav class = "barnav">
            <ul class = "nav__links">
                <li><a href = "/">Lost Items</a></li>
                <li><a href = "/found">Found Item</a></li>
                <li><a href = "/logout">Sign Out</a></li>
            </ul>
        </nav>
        {%else %}
        <a href = "/choice"><img src = "/static/images/logo_black.png" class = "logo" style = "max-width: 200px"></a>
        <nav class = "barnav">
            <ul class = "nav__links">
                <li><a href = "/register">Register</a></li>
                <li><a href = "/logout">Sign Out</a></li>
            </ul>
        </nav>

        {%endif%}
    </header>

    {% block main %}

    {% endblock %}



</body>


</html>
