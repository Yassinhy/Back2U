<!DOCTYPE HTML>
<html>

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">


    <title>{% block title %}{% endblock %}</title>

</head>
<body>
    <!--Make a navigation bar!!!-->
    
        {%if session['user_id'] %}
        <header class="my_header">
            <a href = "/choice"><img src = "/static/images/logo_black.png" class = "logo"></a>
            <nav class = "barnav">
                <ul class = "nav__links" style="padding-right: 10; padding-left: 0px;">
                    <li><a href = "/my_uploads" title="my uploads"><img src = "/static/images/uploads_icon.png" style = "width: 50px; margin-right: 20px"></a></li>
                    <li><a href = "/logout" title="sign out"><img src = "/static/images/signout.png" style = "width: 40px; margin-left: 0px"></a></li>
                </ul>
            </nav>
        </header>
        {%else %}
        <header style="display: flex; justify-content: center; padding-bottom: 3%;">
            <img src = "/static/images/logo_black.png" class = "logo" style="width: 140px;">
        </header>
        {%endif%}
        {% if get_flashed_messages() %}
                    
            <div class="alert alert-primary mb-0 text-center" style="margin-bottom: 50px;" role="alert">
                {{ get_flashed_messages() | join(" ") }}
            </div>
                    
        {% endif %}
    {% block main %}

    {% endblock %}



</body>


</html>
