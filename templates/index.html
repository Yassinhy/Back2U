{% extends "layout.html" %}

{% block title %}
    Lost Items
{% endblock %}

{% block main %}
<div class = "home_screen">
        {%for item in items%}
            <div class = "itemss" id = "{{item['id']}}">
                <img src = "static/uploads/{{item['picture']}}">
                <div class = "info">
                    <div class = "item-title">{{item['title']}}</div>
                    <div class = "item-description">{{item['short_description']}}</div>
                </div>
            </div>

        {%endfor%}
</div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const items = document.querySelectorAll('.itemss');

            items.forEach((item) => {
                item.addEventListener('click', function() {
                    const item_viewing = this.id;
                    window.location.href = "/viewingpage?item_id=" + encodeURIComponent(item_viewing);
                });
            });
        });
    </script>
{% endblock %}
