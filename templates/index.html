{% extends "layout.html" %}

{% block title %}
    Lost Items
{% endblock %}

{% block main %}
<div class="menu-grid">
    {% for item in items %}
        <div class="menu-card" id="{{ item['id'] }}">
            <div class="card-image">
                <img src="static/uploads/{{ item['picture'] }}" alt="{{ item['title'] }}">
            </div>
            <div class="card-body">
                <p class="menu-name">{{ item['title'] }}</p>
                <p class="menu-description">{{ item['short_description'] }}</p>
            </div>
        </div>
    {% endfor %}
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const items = document.querySelectorAll('.menu-card');

        items.forEach((item) => {
            item.addEventListener('click', function() {
                const item_viewing = this.id;
                window.location.href = "/viewingpage?item_id=" + encodeURIComponent(item_viewing);
            });
        });
    });
</script>
{% endblock %}
