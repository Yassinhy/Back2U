{% extends "layout.html" %}

{% block title %}
    Welcome
{% endblock %}

{% block main %}

<style>
#logging_page{
    margin-bottom: 0.6em;
}
</style>

<div class = "container"  id = "logging_page" style = "margin-top: 0px; width: 100%">

    <div  id = "inside_logging_page" style="width: 100%;">
        <p class="heading_title">Sign Up</p>

        <form method="post" id="sign_in_form">
            <div>
                <input placeholder=" " class="Email_input" name="email" autocomplete="off">
                <div class="labelline">Enter email</div>
            </div>
        
            <div>
                <div class="phone-input-container" style="height: 45px; width: 100%;">
                    <div style="display: flex; align-items: center; gap: 4px; margin-bottom: 0px;">
                        <img src="https://flagcdn.com/eg.svg" alt="EG Flag" width="20" height="14" style="border-radius: 2px;">
                        <span style="font-size: 14px; font-weight: 500;">+20</span>
                    </div>
                    <input type="tel" name="phone" placeholder="Phone number" pattern="[0-9]{10}" class="phone-input" required>
                </div>
            </div>
            
                    
            <div>
                <input placeholder=" " class="Email_input" name="password" autocomplete="off" type="password">
                <div class="labelline" style="max-width: 135px">Enter password</div>
            </div>
            
            <div>
                <input placeholder=" " class="Email_input" name="confirmation" autocomplete="off" type="password">
                <div class="labelline" style="max-width: 155px;">Confirm password</div>
            </div>
            
            <button type="submit" style="background-color: #bc1422; border-color: #bc1422; margin-top: 30px" class="btn btn-primary active sign">Sign Up</button>
        </form>
    </div>


    <div id = "register_choice">
        <h1 style = "color: white; text-align: center;">Already have an account?</h1>
        <br>
        <a href="/login" class="btn btn-primary active sign" style="margin-top: 100px; background-color: white; border-color: white; color: #bc1422;">Sign In</a>


    </div>

    
</div>
{% endblock %}
